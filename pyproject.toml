[project]
name = "quote-agent"
version = "0.1.0"
description = "Personal-use Ontario auto insurance quote discovery and comparison agent"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.11",
    "playwright>=1.47",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "Pillow>=10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quote_agent"]
