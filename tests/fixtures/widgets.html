<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Widget fixture</title>
<style>
  .chip { display: inline-block; padding: 4px 10px; border: 1px solid #999; margin-right: 4px; cursor: pointer; }
  .chip[aria-checked="true"] { background: #ddd; font-weight: bold; }
  .dropdown-list { border: 1px solid #999; display: none; }
  .dropdown-list.open { display: block; }
  .dropdown-list [role="option"] { padding: 4px 8px; cursor: pointer; }
</style>
</head>
<body>

  <!-- Plain text input -->
  <label for="first-name">First Name</label>
  <input id="first-name" type="text" placeholder="First Name">

  <!-- Native date input: unlike a readonly text field standing in for a
       custom JS date picker, this has no ambiguity -- Playwright's fill()
       works directly against it given an ISO "YYYY-MM-DD" string. -->
  <label for="coverage-start">Coverage start date</label>
  <input id="coverage-start" type="date">

  <!-- Native select -->
  <label for="province">Province</label>
  <select id="province">
    <option value="">Please select</option>
    <option value="ON">Ontario</option>
    <option value="QC">Quebec</option>
    <option value="BC">British Columbia</option>
  </select>

  <!-- Custom ARIA-compliant combobox (div-based, not a native select) -->
  <div id="licence-status-widget">
    <button type="button" role="combobox" aria-haspopup="listbox" aria-expanded="false" id="licence-status-trigger">
      Please select
    </button>
    <ul role="listbox" class="dropdown-list" id="licence-status-list">
      <li role="option" data-value="Licenced">Licenced</li>
      <li role="option" data-value="Suspended">Suspended</li>
      <li role="option" data-value="Cancelled">Cancelled</li>
    </ul>
  </div>

  <!-- Radio-style toggle "pills" (not native radio inputs, role=radio on divs) -->
  <div role="radiogroup" aria-label="Vehicle use" id="vehicle-use-group">
    <span role="radio" aria-checked="false" data-value="commute" class="chip">Commuting</span>
    <span role="radio" aria-checked="false" data-value="pleasure" class="chip">Pleasure</span>
    <span role="radio" aria-checked="false" data-value="business" class="chip">Business</span>
  </div>

  <!-- Checkbox -->
  <label><input type="checkbox" id="winter-tires"> Do you have winter tires?</label>

  <!-- +/- stepper, no direct text entry -->
  <div id="tickets-stepper">
    <button type="button" id="tickets-minus">-</button>
    <span id="tickets-value">0</span>
    <button type="button" id="tickets-plus">+</button>
  </div>

  <!-- Date picker: typing does not register, only clicking a calendar day does -->
  <label for="start-date">Start Date</label>
  <input id="start-date" type="text" placeholder="dd-mm-yyyy" readonly>
  <div id="calendar" style="display:none;">
    <button type="button" id="cal-prev">Prev</button>
    <span id="cal-header"></span>
    <button type="button" id="cal-next">Next</button>
    <div id="cal-days"></div>
  </div>

  <!-- Address autocomplete: typing alone doesn't set a valid value, a suggestion must be clicked -->
  <label for="address">Street Address</label>
  <input id="address" type="text" placeholder="Please enter and select street address" autocomplete="off">
  <ul id="address-suggestions" style="display:none;"></ul>

  <!-- Mislinked label: for="postal_code" points at nothing (mirrors a real
       site where a hidden decoy control never actually carried that id,
       likely stale after a refactor). The real, visible field sits right
       next to it in the same row with no `for=` link of its own. -->
  <div id="mislinked-row">
    <label for="postal_code">My alternate address is</label>
    <input formcontrolname="postal_code" type="hidden" value="">
    <input id="alt-street-status" type="hidden" value="Empty">
    <input id="alt-street-address" type="text" placeholder="Please enter and select street address">
  </div>

  <!-- Decorative label with no for= and no wrapped control at all (mirrors
       a real site's "Terms of Use and Privacy Policy." text sitting next
       to an unrelated checkbox it doesn't actually label). Must stay
       undiscoverable rather than get guessed-paired with that checkbox. -->
  <div id="decorative-label-row">
    <input id="consent-checkbox" type="checkbox">
    <label for="consent-checkbox">I agree to the</label>
    <label>Terms of Use and Privacy Policy.</label>
  </div>

  <!-- A control with its own aria-label and no separate <label> element at
       all (mirrors a real site's Year/Make/Model <select> elements, e.g.
       aria-label="Select the model of your car", no for=, no wrapping
       <label>) -- confirmed to be completely invisible to discovery
       before this was handled. -->
  <input id="company-name" type="text" aria-label="Company name" placeholder="Company">

  <!-- Guaranteed-to-fail widget: a radio group whose only option never
       matches any real value, used to test that one field's interaction
       failure doesn't take down the rest of the page's fill attempt. -->
  <div role="radiogroup" aria-label="Impossible to satisfy" id="impossible-group">
    <span role="radio" aria-checked="false" data-value="only-option" class="chip">Only Option</span>
  </div>

  <!-- Yes/No radiogroup: mirrors a real site's boolean-style question --
       real display text is "Yes"/"No", never the Python str(bool) values
       ("True"/"False") a boolean field's value actually stringifies to. -->
  <div role="radiogroup" aria-label="Yes or no question" id="yes-no-group">
    <span role="radio" aria-checked="false" class="chip">Yes</span>
    <span role="radio" aria-checked="false" class="chip">No</span>
  </div>

  <!-- Fragmented radiogroup: each option gets its own separate
       role="radiogroup" (one radio each) instead of one group with all
       three options -- confirmed on a real site (Aviva) for its
       "condition of car" and "anti-theft device" questions. Their shared
       parent carries the real question as its own aria-label. -->
  <div aria-label="What was the condition of your car when you got it" id="fragmented-condition">
    <div role="radiogroup" aria-label="New"><span role="radio" aria-checked="false" class="chip">New</span></div>
    <div role="radiogroup" aria-label="Used"><span role="radio" aria-checked="false" class="chip">Used</span></div>
    <div role="radiogroup" aria-label="Demo under 5,000 kms">
      <span role="radio" aria-checked="false" class="chip">Demo under 5,000 kms</span>
    </div>
  </div>

  <!-- Cascading select: starts with only a placeholder option and
       populates asynchronously (mirrors a real site's Make dropdown,
       which only fills in after a Year is chosen) -- with real option
       text in a different case than a stored value would realistically
       be ("TOYOTA" vs. "Toyota"), confirmed to break a strict
       case-sensitive match on a real site (Aviva). -->
  <label for="cascading-make">Vehicle make (cascading)</label>
  <select id="cascading-make">
    <option value="">Select</option>
  </select>

  <!-- Multi-select cards: independently toggled, not mutually exclusive like a radio group -->
  <div id="additional-drivers">
    <div class="driver-card" data-selected="false">Person A</div>
    <div class="driver-card" data-selected="false">Person B</div>
    <div class="driver-card" data-selected="false">Person C</div>
  </div>

<script>
  const CAL_MONTHS = [
    { name: 'August', number: 8, year: 2026, days: 31 },
    { name: 'September', number: 9, year: 2026, days: 30 },
    { name: 'October', number: 10, year: 2026, days: 31 },
  ];
  let calMonthIndex = 0;

  function renderCalendar() {
    const m = CAL_MONTHS[calMonthIndex];
    document.getElementById('cal-header').textContent = `${m.name} ${m.year}`;
    const daysDiv = document.getElementById('cal-days');
    daysDiv.innerHTML = '';
    for (let d = 1; d <= m.days; d++) {
      const link = document.createElement('a');
      link.href = '#';
      link.textContent = String(d);
      link.addEventListener('click', (e) => {
        e.preventDefault();
        const dd = String(d).padStart(2, '0');
        const mm = String(m.number).padStart(2, '0');
        document.getElementById('start-date').value = `${dd}-${mm}-${m.year}`;
        document.getElementById('calendar').style.display = 'none';
      });
      daysDiv.appendChild(link);
    }
  }

  document.getElementById('start-date').addEventListener('click', () => {
    document.getElementById('calendar').style.display = 'block';
  });
  document.getElementById('cal-prev').addEventListener('click', () => {
    calMonthIndex = Math.max(0, calMonthIndex - 1);
    renderCalendar();
  });
  document.getElementById('cal-next').addEventListener('click', () => {
    calMonthIndex = Math.min(CAL_MONTHS.length - 1, calMonthIndex + 1);
    renderCalendar();
  });

  renderCalendar();
</script>

<script>
  const addressInput = document.getElementById('address');
  const addressSuggestions = document.getElementById('address-suggestions');
  // Real address-autocomplete widgets (e.g. Onlia's, backed by Canada
  // Post's AddressComplete) were confirmed to search only on real
  // keystroke events, never on a single bulk value-set -- so this only
  // listens for 'keyup', not 'input', to make sure a fix here actually
  // has to type character-by-character rather than just set .value once.
  addressInput.addEventListener('keyup', () => {
    const query = addressInput.value;
    addressSuggestions.innerHTML = '';
    if (query.length > 0) {
      const options = [`${query} St, Toronto, ON M5V 3A8`, `${query} St, Ottawa, ON K1P 1J1`];
      options.forEach((opt) => {
        const li = document.createElement('li');
        li.textContent = opt;
        li.addEventListener('click', () => {
          addressInput.value = opt;
          addressSuggestions.style.display = 'none';
        });
        addressSuggestions.appendChild(li);
      });
      addressSuggestions.style.display = 'block';
    } else {
      addressSuggestions.style.display = 'none';
    }
  });

  document.querySelectorAll('#additional-drivers .driver-card').forEach((card) => {
    card.addEventListener('click', () => {
      const selected = card.dataset.selected === 'true';
      card.dataset.selected = selected ? 'false' : 'true';
    });
  });

  setTimeout(() => {
    const select = document.getElementById('cascading-make');
    ['HONDA', 'TOYOTA', 'HYUNDAI', 'MAZDA'].forEach((make) => {
      const opt = document.createElement('option');
      opt.value = make;
      opt.textContent = make;
      select.appendChild(opt);
    });
  }, 300);
</script>

<script>
  const trigger = document.getElementById('licence-status-trigger');
  const list = document.getElementById('licence-status-list');
  trigger.addEventListener('click', () => {
    const open = list.classList.toggle('open');
    trigger.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
  list.querySelectorAll('[role="option"]').forEach((opt) => {
    opt.addEventListener('click', () => {
      trigger.textContent = opt.dataset.value;
      trigger.dataset.value = opt.dataset.value;
      list.classList.remove('open');
      trigger.setAttribute('aria-expanded', 'false');
    });
  });

  document.querySelectorAll('#vehicle-use-group [role="radio"]').forEach((chip) => {
    chip.addEventListener('click', () => {
      document.querySelectorAll('#vehicle-use-group [role="radio"]').forEach((c) => c.setAttribute('aria-checked', 'false'));
      chip.setAttribute('aria-checked', 'true');
    });
  });

  document.querySelectorAll('#fragmented-condition [role="radio"]').forEach((chip) => {
    chip.addEventListener('click', () => {
      document.querySelectorAll('#fragmented-condition [role="radio"]').forEach((c) => c.setAttribute('aria-checked', 'false'));
      chip.setAttribute('aria-checked', 'true');
    });
  });

  let ticketsValue = 0;
  const ticketsSpan = document.getElementById('tickets-value');
  document.getElementById('tickets-plus').addEventListener('click', () => {
    ticketsValue += 1;
    ticketsSpan.textContent = String(ticketsValue);
  });
  document.getElementById('tickets-minus').addEventListener('click', () => {
    ticketsValue = Math.max(0, ticketsValue - 1);
    ticketsSpan.textContent = String(ticketsValue);
  });
</script>
</body>
</html>
